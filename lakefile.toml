name = "modular_bootstrap"
version = "0.1.0"
defaultTargets = ["GapFamily", "BTZEntropy"]

[[lean_lib]]
name = "GapFamily"

[[lean_lib]]
name = "BTZEntropy"

[[lean_lib]]
name = "FixedPointTheorems"
srcDir = "vendor/fixed-point"
globs = ["FixedPointTheorems.*"]
leanOptions.autoImplicit = false

[[lean_lib]]
name = "Homogenization"
srcDir = "vendor/elliptic"
globs = ["Homogenization.+"]
leanOptions.autoImplicit = false
leanOptions.relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"
